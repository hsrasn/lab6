<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="main">
        <h1>Lab 6</h1>
        <h2>Like or dislike</h2>

        <button id="like">👍<span id="likes">100</span></button>
        <button id="dislike">👎<span id="dislikes">20</span></button>

        <h3>Comments</h3>

        <form id="form">
            <textarea id="input" placeholder="Write a comment..."></textarea>
            <button type="submit">Submit</button>
            <button type="button" id="clear">Clear</button>
        </form>

        <div id="comments"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
